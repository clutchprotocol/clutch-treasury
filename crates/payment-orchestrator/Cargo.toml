[package]
name = "payment-orchestrator"
version = "0.1.0"
edition = "2021"

[lib]
name = "payment_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "payment-orchestrator"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7.5", features = ["macros"] }
config = "0.14.0"
dotenv = "0.15"
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.12.7", features = ["json"] }
async-trait = "0.1"
# Discriminator shuffle only (uq_active_pay_amount) — already resolves to 0.8.7 in
# Cargo.lock via secp256k1's "rand" feature in clutch-chain, so this direct dep adds
# no new version to pin.
rand = "0.8"
# Tron address validation (Plan C T6): base58check decode with the built-in double-SHA256
# checksum verification ("check" feature) — a shape regex ("T…, 34 chars") passes a single
# mistyped character; only the checksum catches it. Small, focused dep beats hand-rolling
# base58 + double-SHA256 to avoid adding it.
bs58 = { version = "0.5", features = ["check"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
hex.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
