# 8091 — matches Dockerfile.orchestrator EXPOSE/HEALTHCHECK and the clutch-deploy port map.
# Was 8095, which no other file agreed with: the image healthchecked 8091 and would have reported
# unhealthy forever while the process listened elsewhere.
http_addr = "0.0.0.0:8091"
# Prometheus scrape target. Deliberately NOT a route on http_addr: that one is public
# through nginx's /payment/ route, and deposit counts are not public.
metrics_addr = "0.0.0.0:9102"
database_url = "postgres://postgres:postgres@localhost:5434/orchestrator"
jwt_secret = ""
# "*" for local dev; clutch-deploy overrides via APP_ALLOWED_ORIGINS for staging/production
# (same ALLOWED_ORIGINS list as the hub API — both are called from the same demo-app origin).
allowed_origins = "*"
public_base_url = "http://localhost:8095"
treasury_url = "http://localhost:8090"
treasury_initiator_token = ""
treasury_readonly_token = ""
custody_tron_address = ""
poll_interval_secs = 30
# Hours a user's deposit address stays on the fast poll tier after they open the deposit panel.
# See OrchConfig::deposit_hot_window_hours. Very large values collapse tiering into polling everything.
deposit_hot_window_hours = 24
# Task 8: gates POST /api/v1/deposits (permanent per-user addresses). While false, the route
# 503s before authentication — see OrchConfig::permanent_deposit_addresses_enabled doc comment.
permanent_deposit_addresses_enabled = false
# Plan C T6: the payout rail is a real TRC-20 transfer now (tron-signer's /internal/payout), but
# this stays false until its rollout finishes (float funded, reconciliation verified) — see
# OrchConfig::redemptions_enabled doc comment.
redemptions_enabled = false
min_redemption_clt = 1000000
max_redemption_clt = 50000000
