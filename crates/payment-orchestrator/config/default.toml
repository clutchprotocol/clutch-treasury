# 8091 — matches Dockerfile.orchestrator EXPOSE/HEALTHCHECK and the clutch-deploy port map.
# Was 8095, which no other file agreed with: the image healthchecked 8091 and would have reported
# unhealthy forever while the process listened elsewhere.
http_addr = "0.0.0.0:8091"
database_url = "postgres://postgres:postgres@localhost:5434/orchestrator"
jwt_secret = ""
bitcart_url = "http://localhost:8000"
bitcart_token = ""
bitcart_store_id = ""
# The payment token, NOT fiat. A fiat code makes Bitcart round the discriminator away and
# apply a conversion rate (proven against a live 0.10.3.0 instance).
bitcart_invoice_currency = "USDT"
public_base_url = "http://localhost:8095"
treasury_url = "http://localhost:8090"
treasury_initiator_token = ""
treasury_readonly_token = ""
custody_tron_address = ""
deposit_ttl_minutes = 30
min_deposit_usdt = 1000000
max_deposit_usdt = 50000000
poll_interval_secs = 30
# Plan C T6: stays false until a real TRC-20 payout rail replaces treasury-service's
# payout::StubRail — see OrchConfig::redemptions_enabled doc comment.
redemptions_enabled = false
min_redemption_clt = 1000000
max_redemption_clt = 50000000
