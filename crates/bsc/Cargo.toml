[package]
name = "bsc"
version = "0.1.0"
edition = "2021"

# BEP-20 USDT on BNB Smart Chain (docs/superpowers/specs/2026-10-23-bsc-usdt-design.md): the shared
# settings and a read-only JSON-RPC client. No key and nothing that signs: the key-free
# payment-orchestrator links this crate too.
[dependencies]
reqwest = { version = "0.12.7", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

[dev-dependencies]
tokio.workspace = true
wiremock = "0.6"
