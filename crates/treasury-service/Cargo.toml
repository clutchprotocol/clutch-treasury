[package]
name = "treasury-service"
version = "0.1.0"
edition = "2021"

[lib]
name = "treasury_service"
path = "src/lib.rs"

[[bin]]
name = "treasury-service"
path = "src/main.rs"

[dependencies]
clutch-chain = { path = "../clutch-chain" }
# Needed for `dyn PayoutRail` — native async-fn-in-traits is not dyn-compatible on stable
# Rust; this is the standard one-annotation way to box the future instead of hand-writing
# `Pin<Box<dyn Future<...>>>` signatures. Same trait-object shape as `ChainSigner`, which
# stays sync and needs no boxing — PayoutRail's brief-specified signature is async.
async-trait = "0.1"
axum = { version = "0.7.5", features = ["macros"] }
config = "0.14.0"
dotenv = "0.15"
sqlx = { version = "0.8.2", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4.38", features = ["serde"] }
sha3 = "0.10.1"
# TronGrid REST calls (tron_verifier.rs) — same version payment-orchestrator's BitcartAdapter
# already resolves to in Cargo.lock, so this direct dep adds no new version to pin.
reqwest = { version = "0.12.7", features = ["json"] }
# Tron base58check decode, for ABI-encoding the custody address into a balanceOf(address) call.
# `check` verifies the double-SHA256 checksum and the 0x41 version byte, so a mistyped custody
# address is rejected rather than silently reading some other account's balance. Same crate and
# version payment-orchestrator already uses, so Cargo.lock gains nothing new.
bs58 = { version = "0.5", features = ["check"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
hex.workspace = true
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
