node_ws_url = "ws://localhost:8081/ws"
chain_id = 2077
mint_authority_secret = ""
initiator_token = ""
approver_token = ""
readonly_token = ""
daily_mint_cap_clt = 500000000
per_tx_mint_cap_clt = 50000000
backing_target_bps = 10050
backing_halt_bps = 10000
confirmations = 2
outbox_poll_ms = 2000
reconciliation_interval_secs = 86400
# Zero. The chain no longer pre-mints anything at genesis, so every CLT in existence was minted
# by this service against a deposit, and `onchain_supply - genesis_allocation` is simply the
# supply. A non-zero value here would subtract CLT that does not exist from the supply that does,
# and reconciliation would read the difference as CLT minted without a ledger entry behind it.
genesis_allocation = 0
