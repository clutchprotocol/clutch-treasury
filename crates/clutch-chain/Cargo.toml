[package]
name = "clutch-chain"
version = "0.1.0"
edition = "2021"

[dependencies]
rlp = "0.5.2"
secp256k1 = { version = "0.29.1", features = ["recovery", "rand"] }
sha3 = "0.10.1"
futures-util = "0.3"
tokio-tungstenite = "0.23.1"
uuid = { version = "1", features = ["v4"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
hex.workspace = true
# azure_kms_signer.rs: same version already used identically in treasury-service, tron-signer and
# payment-orchestrator, so this adds no new version to reconcile in the lockfile.
reqwest = { version = "0.12.7", features = ["json"] }
base64 = "0.22"

[dev-dependencies]
# azure_kms_signer.rs tests: same version already used in treasury-service and payment-orchestrator.
wiremock = "0.6"
