services:
  test-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: treasury_test
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  test:
    image: rust:1.86-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - treasury-cargo-cache:/usr/local/cargo/registry
      - treasury-target-cache:/app/target
    environment:
      # Both spellings are required and they are NOT redundant: integration tests read the plain
      # DATABASE_URL via std::env::var, while AppConfig only sees APP_-prefixed vars (the `config`
      # crate's Environment prefix). Setting only one produces a confusing failure in whichever
      # half you forgot — the service can't connect, or every DB test panics on a missing var.
      DATABASE_URL: postgres://postgres:postgres@test-postgres:5432/treasury_test
      APP_DATABASE_URL: postgres://postgres:postgres@test-postgres:5432/treasury_test
      # The already-public node1 dev key — the one carve-out to this repo's env-only secret rule,
      # scoped to the test rig. Never a real mint key.
      APP_MINT_AUTHORITY_SECRET: "0883ddd3d07303b87c954b0c9383f7b78f45e002520fc03a8adc80595dbf6509"
      APP_INITIATOR_TOKEN: test-initiator
      APP_APPROVER_TOKEN: test-approver
      APP_READONLY_TOKEN: test-readonly
      # Plan C T5's TronGrid verifier — wiremock stands in for the real TronGrid host in
      # tests, but AppConfig::load still panics on an empty key regardless.
      APP_TRONGRID_API_KEY: test-trongrid-key
      # payment-orchestrator's own secrets, same test rig, same rule: OrchConfig::load
      # panics on an empty one, so all four must be present for `cargo test --workspace`
      # to even construct a config in orchestrator tests.
      APP_JWT_SECRET: test-jwt-secret
      APP_BITCART_TOKEN: test-bitcart-token
      APP_TREASURY_INITIATOR_TOKEN: test-initiator
      APP_TREASURY_READONLY_TOKEN: test-readonly
    depends_on:
      test-postgres:
        condition: service_healthy
    # --test-threads=1: DB tests share one Postgres and TRUNCATE each other's tables;
    # parallel threads inside one test binary would race. Serial is fine at this size.
    command: cargo test --workspace -- --test-threads=1

volumes:
  treasury-cargo-cache:
  treasury-target-cache:
