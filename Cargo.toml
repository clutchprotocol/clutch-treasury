[workspace]
resolver = "2"
members = ["crates/clutch-chain", "crates/treasury-service", "crates/payment-orchestrator", "crates/tron-signer"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
hex = "0.4.3"
